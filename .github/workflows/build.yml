name: Build and release q2-2048

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld make gcc python3 zip unzip file
      - name: Test and build
        run: |
          make check
          make
      - name: Verify install package
        run: |
          unzip -t dist/q2-2048.zip
          for icon in icon.png icon-40.png pane.png; do
            unzip -Z1 dist/q2-2048.zip | grep -Fx ".2048/$icon"
          done
          file dist/.2048/icon.png | grep -F '52 x 52'
          file dist/.2048/icon-40.png | grep -F '40 x 40'
          file dist/.2048/pane.png | grep -F '96 x 96'
          unzip -p dist/q2-2048.zip .2048/q2app | grep -Fx 'game=1'
          test -s dist/.2048/LICENSE.txt
          file dist/.2048/q2-2048 | grep -E 'ELF 32-bit LSB.*MIPS'
      - uses: actions/upload-artifact@v6
        with:
          name: q2-2048-card-app
          path: dist/q2-2048.zip
          if-no-files-found: error

  release:
    if: (startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Release v1.2.1'))
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: q2-2048-card-app
          path: dist
      - name: Publish release ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.2.1' }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/q2-2048.zip --clobber
          else
            gh release create "$RELEASE_TAG" dist/q2-2048.zip \
              --target "$GITHUB_SHA" --generate-notes --title "$RELEASE_TAG"
          fi
